backend:
  name: git-gateway
  branch: master

media_folder: "assets/blog"
public_folder: "/assets/blog"

locale: "tr"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Blog Yazısı"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - { label: "Açıklama (SEO / önizleme için)", name: "description", widget: "text" }
      - { label: "Kapak Görseli", name: "cover", widget: "image", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }
