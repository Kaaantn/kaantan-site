backend:
  name: git-gateway
  branch: master

media_folder: "assets/blog"
public_folder: "/assets/blog"

locale: "tr"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Blog Yazısı"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - { label: "Açıklama (SEO / önizleme için)", name: "description", widget: "text" }
      - { label: "Kapak Görseli", name: "cover", widget: "image", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }

  - name: "bio"
    label: "Bio Sayfası"
    files:
      - name: "bio"
        label: "Bio Sayfası İçeriği"
        file: "blog/_data/bio.json"
        media_folder: "/assets/bio"
        public_folder: "/assets/bio"
        fields:
          - { label: "İsim", name: "displayName", widget: "string" }
          - { label: "Konum", name: "location", widget: "string", required: false }
          - { label: "Bio Metni", name: "bio", widget: "text", hint: "Yeni satır için Enter'a basabilirsiniz." }
          - { label: "Profil Fotoğrafı", name: "avatar", widget: "image" }
          - { label: "Banner / Vurgu Rengi", name: "bannerColor", widget: "string", hint: "Hex renk kodu, örn: #A3E635" }
          - { label: "E-posta Butonunu Göster", name: "showEmail", widget: "boolean", default: true }
          - { label: "E-posta Adresi", name: "email", widget: "string", required: false }
          - { label: "Telefon Butonunu Göster", name: "showPhone", widget: "boolean", default: true }
          - { label: "Telefon Numarası", name: "phone", widget: "string", required: false }
          - label: "Sosyal Medya İkonları"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "select", options: ["instagram", "tiktok", "youtube", "linkedin", "github", "behance"] }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Takipçi/Abone Sayısını Canlı Çek (sadece YouTube için çalışır)", name: "live", widget: "boolean", default: false, required: false }
              - { label: "Takipçi/Abone Sayısı (elle gir - YouTube dışındaki platformlar için)", name: "followerCount", widget: "string", required: false, hint: "Örn: 12500 ya da 12.5K. Boş bırakırsan sayı gösterilmez." }
          - label: "Linkler"
            name: "links"
            widget: "list"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Alt Yazı (görünen adres/açıklama)", name: "subtitle", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "İkon", name: "icon", widget: "select", options: ["mic", "search", "link", "star", "shopping-bag", "globe", "message-circle", "activity", "terminal", "kt-logo", "image"] }
              - { label: "Özel Logo Görseli (sadece İkon = 'image' seçiliyse)", name: "iconImage", widget: "image", required: false, hint: "Kendi logonu yüklemek istersen İkon alanından 'image' seç ve buraya yükle." }
              - { label: "İkon Kutusu Rengi", name: "color", widget: "string", required: false, hint: "Hex renk kodu, örn: #000000. Boş bırakırsan banner rengi kullanılır." }
              - { label: "İkon Rengi", name: "iconColor", widget: "string", required: false, hint: "Koyu arka plan için #FFFFFF, açık arka plan için #0A0A0A gibi." }
              - { label: "Avantaj Rozeti (opsiyonel)", name: "perk", widget: "string", required: false, hint: "Örn: Kayıt olana 20$ ücretsiz kredi. Boş bırakırsan rozet gösterilmez." }

  - name: "shop"
    label: "Shop Sayfası"
    files:
      - name: "shop"
        label: "Shop Sayfası İçeriği"
        file: "blog/_data/shop.json"
        fields:
          - { label: "Üst Açıklama", name: "intro", widget: "text" }
          - { label: "Shopier Mağaza Linki", name: "storeUrl", widget: "string" }
          - label: "Ürünler"
            name: "products"
            widget: "list"
            fields:
              - { label: "Ürün Adı", name: "title", widget: "string" }
              - { label: "Alt Başlık", name: "subtitle", widget: "string", required: false }
              - { label: "Görsel URL", name: "image", widget: "string", hint: "Shopier ürün görselinin linki (Shopier ürün sayfasındaki görsele sağ tık > Görsel adresini kopyala)." }
              - { label: "Fiyat", name: "price", widget: "string", hint: "Örn: 149 TL" }
              - { label: "Eski Fiyat (opsiyonel)", name: "oldPrice", widget: "string", required: false }
              - { label: "Rozet (opsiyonel)", name: "badge", widget: "string", required: false, hint: "Örn: %63 İndirim" }
              - { label: "Ürün Tipi (opsiyonel)", name: "type", widget: "string", required: false, hint: "Örn: Dijital Ürün" }
              - { label: "Shopier Ürün Linki", name: "url", widget: "string" }
